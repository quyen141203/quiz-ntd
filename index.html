<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa;color:#202124}
header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.logo{font-size:21px;font-weight:800;color:#4f46e5}.top-actions{display:flex;gap:10px}
button{border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:#4f46e5;color:#fff}.secondary{background:#eef0f4;color:#333}.danger{background:#fee2e2;color:#b91c1c}
main{max-width:1100px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #e6e8ec;border-radius:18px;padding:26px;box-shadow:0 5px 18px rgba(0,0,0,.04);margin-bottom:20px}
h1{font-size:28px;margin:0 0 8px}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #d8dce3;border-radius:10px;padding:11px 12px;font:inherit;background:#fff}textarea{min-height:100px;resize:vertical}
.question-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.question-title{font-size:18px;font-weight:800}
.option-row{display:grid;grid-template-columns:34px 1fr 36px;gap:8px;align-items:center;margin:9px 0}.option-row input[type=radio]{width:18px;height:18px}.icon-btn{padding:8px;border-radius:8px;background:#f1f3f5}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.hidden{display:none!important}
.quiz-wrap{max-width:900px;margin:30px auto;padding:0 20px}.progress{height:7px;background:#e9ebef;border-radius:99px;overflow:hidden;margin:18px 0 28px}.progress>div{height:100%;background:#4f46e5;transition:.25s}
.question-number{font-size:14px;color:#6b7280;font-weight:700}.quiz-question{font-size:25px;line-height:1.45;font-weight:800;margin:12px 0 25px}
.answer{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e1e4e8;border-radius:14px;padding:17px 18px;margin:12px 0;font-size:16px;font-weight:600;transition:.15s}
.answer:hover{border-color:#8b83ef;background:#fafaff}.answer.selected{border:2px solid #4f46e5;background:#f4f2ff}
.nav{display:flex;justify-content:space-between;margin-top:22px}.result{text-align:center}.score{font-size:54px;font-weight:900;color:#4f46e5;margin:12px}.review{text-align:left;margin-top:24px}.review-item{padding:16px;border-radius:12px;background:#f7f8fa;margin:10px 0}.correct{color:#16803c}.wrong{color:#b42318}
.empty{text-align:center;padding:35px;color:#777}
@media(max-width:700px){.grid{grid-template-columns:1fr}header{padding:0 14px}.card{padding:18px}.quiz-question{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="logo">Quiz Maker</div>
  <div class="top-actions">
    <button class="secondary" onclick="showBuilder()">Soạn đề</button>
    <button class="primary" onclick="startQuiz()">Làm bài</button>
  </div>
</header>

<main id="builder">
  <div class="card">
    <h1>Tạo bài kiểm tra</h1>
    <p class="muted">Nhập câu hỏi và các lựa chọn. Chọn đáp án đúng bằng nút tròn bên trái.</p>
    <div class="grid">
      <div><label>Tên bài kiểm tra</label><input id="quizTitle" value="Bài kiểm tra Toán 8"></div>
      <div><label>Mô tả</label><input id="quizDesc" value="Chọn đáp án đúng cho mỗi câu hỏi."></div>
    </div>
  </div>
  <div id="questions"></div>
  <div class="actions">
    <button class="secondary" onclick="addQuestion()">+ Thêm câu hỏi</button>
    <button class="primary" onclick="startQuiz()">Bắt đầu làm bài →</button>
  </div>
</main>

<section id="quiz" class="quiz-wrap hidden">
  <div class="card">
    <h1 id="playTitle"></h1><p id="playDesc" class="muted"></p>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="question-number" id="qNumber"></div>
    <div class="quiz-question" id="qText"></div>
    <div id="answers"></div>
    <div class="nav">
      <button class="secondary" onclick="prevQuestion()">← Câu trước</button>
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Câu tiếp →</button>
    </div>
  </div>
</section>

<section id="result" class="quiz-wrap hidden">
  <div class="card result">
    <h1>Hoàn thành bài kiểm tra 🎉</h1>
    <div class="score" id="score"></div>
    <p id="scoreText" class="muted"></p>
    <button class="primary" onclick="reviewResult()">Xem lại đáp án</button>
    <button class="secondary" onclick="showBuilder()">Soạn lại</button>
    <div id="review" class="review hidden"></div>
  </div>
</section>

<script>
let questionsData=[
 {text:"Thu gọn biểu thức A = 3x² · 2x³, ta được kết quả là:",options:["6x⁵","5x⁶","6x⁶","5x⁵"],correct:0},
 {text:"Kết quả của 2³ · 2² là:",options:["2⁵","4⁵","2⁶","4⁶"],correct:0}
];
let current=0, answers=[], editing=false;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function renderBuilder(){
 const box=document.getElementById('questions'); box.innerHTML='';
 questionsData.forEach((q,i)=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<div class="question-head"><div class="question-title">Câu hỏi ${i+1}</div><button class="danger" onclick="removeQuestion(${i})">Xóa</button></div>
  <label>Nội dung câu hỏi</label><textarea onchange="questionsData[${i}].text=this.value">${esc(q.text)}</textarea>
  <label style="margin-top:14px">Các lựa chọn — chọn đáp án đúng</label>
  <div id="opts-${i}"></div>
  <button class="secondary" onclick="addOption(${i})">+ Thêm lựa chọn</button>`;
  box.appendChild(card);
  const opts=card.querySelector('#opts-'+i);
  q.options.forEach((o,j)=>{
   const row=document.createElement('div');row.className='option-row';
   row.innerHTML=`<input type="radio" name="correct-${i}" ${q.correct===j?'checked':''} onchange="questionsData[${i}].correct=${j}"><input value="${esc(o)}" onchange="questionsData[${i}].options[${j}]=this.value"><button class="icon-btn" onclick="removeOption(${i},${j})">×</button>`;
   opts.appendChild(row);
  });
 });
}
function addQuestion(){questionsData.push({text:"",options:["",""],correct:0});renderBuilder();}
function removeQuestion(i){if(questionsData.length>1){questionsData.splice(i,1);renderBuilder();}}
function addOption(i){questionsData[i].options.push("");renderBuilder();}
function removeOption(i,j){if(questionsData[i].options.length>2){questionsData[i].options.splice(j,1);if(questionsData[i].correct>=questionsData[i].options.length)questionsData[i].correct=0;renderBuilder();}}
function showBuilder(){document.getElementById('builder').classList.remove('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');renderBuilder();window.scrollTo(0,0);}
function startQuiz(){
 if(!questionsData.length)return;
 if(questionsData.some(q=>!q.text.trim()||q.options.some(o=>!o.trim()))){alert("Vui lòng điền đầy đủ câu hỏi và lựa chọn.");return;}
 answers=new Array(questionsData.length).fill(null);current=0;
 document.getElementById('builder').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');
 document.getElementById('playTitle').textContent=document.getElementById('quizTitle').value||"Bài kiểm tra";
 document.getElementById('playDesc').textContent=document.getElementById('quizDesc').value||"";
 renderQuiz();window.scrollTo(0,0);
}
function renderQuiz(){
 const q=questionsData[current];document.getElementById('qNumber').textContent=`Câu ${current+1} / ${questionsData.length}`;
 document.getElementById('qText').textContent=q.text;
 document.getElementById('progressBar').style.width=((current+1)/questionsData.length*100)+'%';
 const box=document.getElementById('answers');box.innerHTML='';
 q.options.forEach((o,i)=>{
  const b=document.createElement('button');b.className='answer'+(answers[current]===i?' selected':'');b.textContent=`${String.fromCharCode(65+i)}.  ${o}`;
  b.onclick=()=>{answers[current]=i;renderQuiz()};box.appendChild(b);
 });
 document.getElementById('nextBtn').textContent=current===questionsData.length-1?"Nộp bài ✓":"Câu tiếp →";
}
function prevQuestion(){if(current>0){current--;renderQuiz();}}
function nextQuestion(){if(answers[current]===null){alert("Hãy chọn một đáp án trước khi tiếp tục.");return}if(current<questionsData.length-1){current++;renderQuiz()}else finishQuiz();}
function finishQuiz(){
 let score=answers.reduce((n,a,i)=>n+(a===questionsData[i].correct?1:0),0);
 document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
 document.getElementById('score').textContent=`${score} / ${questionsData.length}`;
 document.getElementById('scoreText').textContent=`Bạn đúng ${score} trên ${questionsData.length} câu (${Math.round(score/questionsData.length*100)}%).`;
 window.scrollTo(0,0);
}
function reviewResult(){
 const box=document.getElementById('review');box.classList.toggle('hidden');
 if(!box.classList.contains('hidden')){
  box.innerHTML='<h2>Chi tiết</h2>'+questionsData.map((q,i)=>{
   const ok=answers[i]===q.correct;
   return `<div class="review-item"><b>Câu ${i+1}:</b> ${esc(q.text)}<br><span class="${ok?'correct':'wrong'}">${ok?'✓ Đúng':'✗ Sai'}</span> — Đáp án đúng: <b>${String.fromCharCode(65+q.correct)}. ${esc(q.options[q.correct])}</b></div>`;
  }).join('');
 }
}
renderBuilder();
</script>
</body>
</html>
